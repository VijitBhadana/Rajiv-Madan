    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#071322" />
    <script>
      // Every visit starts in dark mode. A switch to light only lasts for this tab
      // (sessionStorage), so reloads keep it but a fresh visit is dark again.
      // Applied before the first paint so the page never flashes white.
      (function () {
        try {
          localStorage.removeItem("theme"); // drop the old, permanent choice
          var saved = sessionStorage.getItem("theme");
          var dark = saved !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = dark ? "#071322" : "#ffffff";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
